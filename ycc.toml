ChainID = 999
CoinPrecision = 100000000
CoinSymbol = "ycc"
Title = "ycc"
version = "2.0.0"

[log]
# 日志级别，支持debug(dbug)/info/warn/error(eror)/crit
logConsoleLevel = "error"
loglevel = "info"
# 日志文件名，可带目录，所有生成的日志文件都放到此目录下
logFile = "logs/chain33.log"

[blockchain]
# 区块数据目录
batchsync = false
dbCache = 512
dbPath = "datadir"
disableBlockBroadcast = false
disableShard = true
enablePushSubscribe = false
enableReExecLocal = false
enableReduceLocaldb = true
enableTxQuickIndex = true
isParaChain = false
isRecordBlockSequence = true
singleMode = false

# [mempool] 的 poolCacheSize / maxTxNumPerAccount 已在内嵌配置（102400 / 100），
# 此处不得重复声明（同键重复会 panic: rewrite defalut key）

[p2p]
dbPath = "datadir/addrbook"
grpcLogFile = "grpc33.log"

[p2p.sub.dht]
# 分组通道, 同一个网络的channel必须相同
channel = 9
# p2p服务端口
port = 13801
#可以自定义设置连接节点
seeds = [
  "/ip4/3.112.197.178/tcp/13801/p2p/16Uiu2HAm5HWtYK211WmKBJWcT8jfbNFGTVft9w29HJqRifiBKotx",
  "/ip4/18.167.231.200/tcp/13801/p2p/16Uiu2HAmF32CeMnNa3ud2hce8F1UGZtvyvZ48SCViMiJN1QJVvcR",
  "/ip4/18.167.240.187/tcp/13801/p2p/16Uiu2HAm8r9GZPPhfXEXGYvHQNgbnRe3CiNvRkFXqioiYumm6mJj",
]

# [p2p.sub.dht.broadcast] 的 disableLtBlock/disableBatchTx/minLtBlockSize 已移入 ycc.go 内嵌配置，
# 此处不得重复声明（同键重复会 panic: rewrite defalut key）

[rpc]
certFile = "cert.pem"
enableTLS = false
grpcBindAddr = "localhost:9902"
grpcFuncWhitelist = ["*"]
jrpcBindAddr = "localhost:9901"
jrpcFuncWhitelist = ["*"]
keyFile = "key.pem"
whitelist = ["127.0.0.1"]

[rpc.sub.eth]
enable = false
httpAddr = "localhost:8547"
httpApi = ["eth", "web3", "personal", "admin", "net"]
# websocket 绑定地址
wsAddr = "localhost:8548"
wsApi = ["eth", "web3", "personal", "admin", "net"]

[consensus.sub.pos33]
bootPeers = [
  "/ip4/18.167.231.200/tcp/10801/p2p/16Uiu2HAmErmNhtS145Lv5fe9FWrHSrNjPkp1eMLeLgi6t3sdr1of",
]
issueTotal = 10000000000
listenPort = 10801

# 注意：maxTxNumber 等 [mver.consensus] 键已内嵌在 ycc.go，不能在此重复声明
# （chain33 配置合并会因同键重复而 panic: rewrite defalut key）

[store]
dbPath = "datadir/kvmvcc"

[wallet]
coinType = "ycc"
dbPath = "wallet"

[health]
listenAddr = "localhost:8708"
